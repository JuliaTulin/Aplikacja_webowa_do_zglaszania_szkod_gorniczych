<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Wstrząsów z Osią Czasu</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nouislider/distribute/nouislider.min.css">
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nouislider/distribute/nouislider.min.js"></script>
    <style>
        #map {
            width: 100%;
            height: 80vh;
        }

        #timeline {
            margin: 20px auto;
            width: 90%;
        }

        .timeline-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="timeline"></div>
    <div class="timeline-labels">
        <span id="start-time">Początek</span>
        <span id="end-time">Koniec</span>
    </div>

    <script>
        // Inicjalizacja mapy
        const map = L.map('map').setView([50.08, 19.16], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Wczytanie danych z pliku JSON
        fetch('wstrzasy_converted.json')
            .then(response => response.json())
            .then(earthquakeData => {
                // Konwersja dat na timestamp
                earthquakeData.forEach(event => {
                    event.timestamp = new Date(event.DATETIME).getTime();
                });

                // Ustawienia osi czasu
                const timestamps = earthquakeData.map(e => e.timestamp);
                const minTime = Math.min(...timestamps);
                const maxTime = Math.max(...timestamps);

                const timeline = document.getElementById('timeline');
                noUiSlider.create(timeline, {
                    start: [minTime, maxTime],
                    connect: true,
                    range: {
                        'min': minTime,
                        'max': maxTime
                    },
                    tooltips: [true, true],
                    format: {
                        to: value => new Date(value).toLocaleString(),
                        from: value => new Date(value).getTime()
                    }
                });

                // Punkty na mapie
                let markers = [];

                function updateMap([start, end]) {
                    // Usuń stare markery
                    markers.forEach(marker => map.removeLayer(marker));
                    markers = [];

                    // Filtruj dane i dodaj markery
                    earthquakeData.filter(event => event.timestamp >= start && event.timestamp <= end)
                        .forEach(event => {
                            const marker = L.circleMarker([event.longitude, event.latitude], {
                                radius: event.ENERGIA/10, // Rozmiar proporcjonalny do energii
                                color: 'red',
                                fillOpacity: 0.8,
                                className: 'blinking'
                            }).addTo(map);

                            marker.bindPopup(`Data: ${event.DATETIME}<br>Energia: ${event.ENERGIA}`);
                            markers.push(marker);

                            // Animacja migania
                            const interval = setInterval(() => {
                                marker.setStyle({ fillOpacity: marker.options.fillOpacity === 0.8 ? 0.4 : 0.8 });
                            }, 500);

                            marker.on('remove', () => clearInterval(interval));
                        });
                }

                // Aktualizacja mapy na podstawie osi czasu
                timeline.noUiSlider.on('update', values => {
                    const [start, end] = values.map(v => parseFloat(v));
                    updateMap([start, end]);

                    document.getElementById('start-time').innerText = new Date(start).toLocaleString();
                    document.getElementById('end-time').innerText = new Date(end).toLocaleString();
                });

                // Wyświetl początkowe dane
                updateMap([minTime, maxTime]);
            })
            .catch(error => console.error('Błąd wczytywania danych:', error));
    </script>
</body>
</html>
